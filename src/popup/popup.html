<!DOCTYPE html>
<html>
<head>
    <title>Extension Popup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            width: 200px;
            background-color: black;
        }
        .image-logo {
            display: flex;
            justify-content: space-around;
            margin: 10px;
        }

        .image-logo img {
            width: 180px;
            height: 95px;
            object-fit: cover;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #FEABB0;
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #fdc7ca;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="image-logo">
            <div id="logo"><img src="../../assets/icons/logo_large.png" alt="LinkedIn UnHumbled Logo"></div>
        </div>
        <button id="settingsButton">Settings</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
