<!DOCTYPE html>
<html>
<head>
    <title>Extension Popup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            width: 200px;
        }
        h1 {
            color: #53f08c;
            font-size: 18px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #A1EEBD;
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #beedcf;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <h1>LinkedIn Unhumble</h1>
        <button id="settingsButton">Settings</button>
    </div>
    <button id="apiKeyButton">Add/edit API key</button>
    <script src="popup.js"></script>
</body>
</html>
